<svg xmlns="http://www.w3.org/2000/svg" width="120" height="36" role="img" aria-label="Demo">
<style>
    rect {
        fill: black;
    }
    path {
        stroke: white;
    }
    text {
        fill: white;
    }

    @media (prefers-color-scheme: dark) {
      rect {
        fill: white;
      }
      path {
        stroke: black;
      }
      text {
        fill: black;
      }
    }
</style>
  <rect width="120" height="36" rx="18"/>
  <text x="34" y="23" text-anchor="start"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600">Demo</text>
  <!-- Lucide "chevron-right" (24x24), scaled into the pill and stroked white -->
  <g transform="translate(76 9) scale(0.8)"
     stroke-linecap="round" stroke-linejoin="round">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right-icon lucide-arrow-up-right"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
  </g>
</svg>
