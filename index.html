<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>totem — three.js infinite scroll stack</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: black;
                color: #cfd2d6;
                overflow: hidden;
                font:
                    13px/1.4 system-ui,
                    sans-serif;
            }
            canvas {
                display: block;
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }
            #hint {
                position: fixed;
                bottom: 16px;
                left: 16px;
                opacity: 0.7;
                pointer-events: none;
            }
            #loading {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                background: #0a0a0c;
                transition: opacity 0.3s ease;
            }
            #loading.done {
                opacity: 0;
                pointer-events: none;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://esm.sh/three@0.184.0",
                    "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <div id="loading">loading…</div>
        <div id="hint">scroll to navigate</div>
        <script type="module" src="./demo.js"></script>
    </body>
</html>
