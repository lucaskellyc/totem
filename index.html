<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <title>totem — three.js infinite scroll stack</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: black;
                color: #cfd2d6;
                overflow: hidden;
                font:
                    13px/1.4 system-monospace,
                    monospace;
                touch-action: manipulation;
                -webkit-text-size-adjust: 100%;
            }
            canvas {
                display: block;
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }
            #hint {
                position: fixed;
                bottom: 16px;
                left: 16px;
                opacity: 0.7;
                pointer-events: none;
            }
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: black;
                transition: opacity 0.3s ease;
            }
            #loading.done {
                opacity: 0;
                pointer-events: none;
            }
            #loading-bar {
                border-radius: 25px;
                width: 180px;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
            }
            #loading-bar-fill {
                width: 0%;
                height: 100%;
                background: #cfd2d6;
                transition:
                    width 0.18s ease,
                    background 0.5s ease;
            }
            #loading-bar-fill.complete {
                background: repeating-linear-gradient(
                    45deg,
                    #cfd2d6 0,
                    #cfd2d6 6px,
                    rgba(207, 210, 214, 0.45) 6px,
                    rgba(207, 210, 214, 0.45) 12px
                );
                background-size: 200% 100%;
                animation: loading-bar-stripes 0.6s linear infinite;
            }
            @keyframes loading-bar-stripes {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: -34px 0;
                }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://esm.sh/three@0.184.0",
                    "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <div id="loading">
            <div id="loading-bar"><div id="loading-bar-fill"></div></div>
            <div>Please hold...</div>
        </div>
        <!--<div id="hint">scroll to navigate</div>-->
        <script type="module" src="./demo.js"></script>
    </body>
</html>
