<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>totem — a three.js experiment</title>
        <style>
            * {
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                margin: 0;
                height: 100dvh;
                background: black;
                color: #cfd2d6;
                overflow: hidden;
                /* Stop trackpad side-swipes from triggering back/forward nav
                   (wheel handler also preventDefaults them). */
                overscroll-behavior: none;
                font:
                    13px/1.4 system-monospace,
                    monospace;
                touch-action: manipulation;
                -webkit-text-size-adjust: 100%;
            }
            canvas {
                position: fixed;
                top: calc(-1 * env(safe-area-inset-top, 0px));
                left: calc(-1 * env(safe-area-inset-left, 0px));
                width: calc(
                    100vw + env(safe-area-inset-left, 0px) +
                        env(safe-area-inset-right, 0px)
                );
                height: calc(
                    100dvh + env(safe-area-inset-top, 0px) +
                        env(safe-area-inset-bottom, 0px)
                );
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-user-drag: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                filter: blur(28px);
                transition: filter 0.5s ease;
            }
            canvas.intro-done {
                filter: blur(0);
            }
            canvas:active {
                cursor: grabbing;
            }
            #feather-top,
            #feather-bottom {
                position: fixed;
                left: 0;
                right: 0;
                height: 120px;
                pointer-events: none;
                z-index: 1;
            }
            #feather-top {
                top: 0;
                background: linear-gradient(
                    to bottom,
                    black 0%,
                    rgba(0, 0, 0, 0) 100%
                );
            }
            #feather-bottom {
                bottom: 0;
                background: linear-gradient(
                    to top,
                    black 0%,
                    rgba(0, 0, 0, 0) 100%
                );
            }
            #hint {
                position: fixed;
                bottom: 16px;
                left: 16px;
                opacity: 0.7;
                pointer-events: none;
            }
            #repo-link {
                position: fixed;
                top: 16px;
                right: 16px;
                border-radius: 999px;
                background: transparent;
                color: #cfd2d6;
                display: flex;
                justify-content: center;
                align-items: center;
                text-decoration: none;
                font: inherit;
                font-size: 16px;
                line-height: 1;
                z-index: 1;
                opacity: 0;
                padding: 8px 12px;
                pointer-events: none;
                transition:
                    background 0.18s ease,
                    border-color 0.18s ease,
                    opacity 0.7s ease;
            }
            #loading.done ~ #repo-link {
                opacity: 1;
                pointer-events: auto;
            }
            #repo-link:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.2);
            }
            #repo-link:active {
                background: rgba(255, 255, 255, 0.12);
            }
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: black;
                z-index: 1;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-user-drag: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                transition:
                    opacity 0.7s ease,
                    filter 0.6s ease,
                    transform 0.6s ease;
            }
            #loading * {
                -webkit-user-drag: none;
                pointer-events: none;
            }
            #loading.done {
                filter: blur(16px);
                opacity: 0;
                transform: scale(1.1);
                pointer-events: none;
            }
            #loading-lottie {
                width: 380px;
                height: 214px;
            }
            #loading-bar {
                border-radius: 25px;
                width: 180px;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
                opacity: 0;
                transition: opacity 1.5s ease;
            }
            #loading-bar.visible {
                opacity: 1;
            }
            #loading-bar-fill {
                border-radius: 25px;
                width: 0%;
                height: 100%;
                background: #cfd2d6;
                /* Width is eased per-frame in JS; keep it out of the CSS
                   transition so the two don't fight. */
                transition:
                    background 0.5s ease,
                    opacity 0.5s ease;
            }
            #loading-bar-fill.complete {
                background: repeating-linear-gradient(
                    45deg,
                    #cfd2d6 0,
                    #cfd2d6 6px,
                    rgba(207, 210, 214, 0.6) 6px,
                    rgba(207, 210, 214, 0.6) 12px
                );
                background-size: 200% 100%;
                animation: loading-bar-stripes 0.6s linear infinite;
            }
            @keyframes loading-bar-stripes {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: -34px 0;
                }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://esm.sh/three@0.184.0",
                    "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/",
                    "lottie-web": "https://esm.sh/lottie-web@5.12.2",
                    "lucide": "https://esm.sh/lucide@0.460.0"
                }
            }
        </script>
    </head>
    <body>
        <div id="feather-top"></div>
        <div id="feather-bottom"></div>
        <div id="loading">
            <div id="loading-lottie"></div>
            <div id="loading-bar"><div id="loading-bar-fill"></div></div>
        </div>
        <script type="module">
            import lottie from "lottie-web";
            import { createElement, ArrowUpRight } from "lucide";
            lottie.loadAnimation({
                container: document.getElementById("loading-lottie"),
                renderer: "svg",
                loop: false,
                autoplay: true,
                path: "./assets/logo.json",
            });
            document.getElementById("repo-link").innerHTML = "Github";
            document
                .getElementById("repo-link")
                .appendChild(createElement(ArrowUpRight));
        </script>
        <a
            id="repo-link"
            href="https://github.com/lucaskellyc/totem"
            target="_blank"
            rel="noopener"
            aria-label="View source on GitHub"
        >
        </a>
        <script type="module" src="./demo.js"></script>
    </body>
</html>
