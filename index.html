<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>totem — three.js infinite scroll stack</title>
        <style>
            * {
                user-select: none;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: black;
                color: #cfd2d6;
                overflow: hidden;
                font:
                    13px/1.4 system-monospace,
                    monospace;
                touch-action: manipulation;
                -webkit-text-size-adjust: 100%;
            }
            canvas {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100lvh;
                user-select: none;
            }
            canvas:active {
                cursor: grabbing;
            }
            #hint {
                position: fixed;
                bottom: 16px;
                left: 16px;
                opacity: 0.7;
                pointer-events: none;
            }
            #repo-link {
                position: fixed;
                top: 16px;
                right: 16px;
                height: 42px;
                width: 42px;
                border-radius: 999px;
                background: transparent;
                display: flex;
                justify-content: center;
                align-items: center;
                text-decoration: none;
                font: inherit;
                line-height: 1;
                z-index: 1;
                opacity: 0;
                pointer-events: none;
                transition:
                    background 0.18s ease,
                    border-color 0.18s ease,
                    opacity 0.7s ease;
            }
            #loading.done ~ #repo-link {
                opacity: 1;
                pointer-events: auto;
            }
            #repo-link:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.2);
            }
            #repo-link:active {
                background: rgba(255, 255, 255, 0.12);
            }
            #repo-link svg {
                height: 24px;
                width: 24px;
            }
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: black;
                z-index: 1;
                user-select: none;
                transition:
                    opacity 0.7s ease,
                    filter 0.6s ease,
                    transform 0.6s ease;
            }
            #loading.done {
                filter: blur(16px);
                opacity: 0;
                transform: scale(1.1);
                pointer-events: none;
            }
            #loading-lottie {
                width: 440px;
                height: 248px;
            }
            #loading-bar {
                border-radius: 25px;
                width: 180px;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
                opacity: 0;
                transition: opacity 1.5s ease;
            }
            #loading-bar.visible {
                opacity: 1;
            }
            #loading-bar-fill {
                border-radius: 25px;
                width: 0%;
                height: 100%;
                background: #cfd2d6;
                transition:
                    width 0.18s ease,
                    background 0.5s ease,
                    opacity 0.5s ease;
            }
            #loading-bar-fill.complete {
                background: repeating-linear-gradient(
                    45deg,
                    #cfd2d6 0,
                    #cfd2d6 6px,
                    rgba(207, 210, 214, 0.6) 6px,
                    rgba(207, 210, 214, 0.6) 12px
                );
                background-size: 200% 100%;
                animation: loading-bar-stripes 0.6s linear infinite;
            }
            @keyframes loading-bar-stripes {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: -34px 0;
                }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://esm.sh/three@0.184.0",
                    "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/",
                    "lottie-web": "https://esm.sh/lottie-web@5.12.2"
                }
            }
        </script>
    </head>
    <body>
        <div id="loading">
            <div id="loading-lottie"></div>
            <div id="loading-bar"><div id="loading-bar-fill"></div></div>
            <!--<div>Please hold...</div>-->
        </div>
        <script type="module">
            import lottie from "lottie-web";
            lottie.loadAnimation({
                container: document.getElementById("loading-lottie"),
                renderer: "svg",
                loop: false,
                autoplay: true,
                path: "./assets/logo.json",
            });
        </script>
        <!--<div id="hint">scroll to navigate</div>-->
        <a
            id="repo-link"
            href="https://github.com/lucaskellyc/totem"
            target="_blank"
            rel="noopener"
            aria-label="View source on GitHub"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <line x1="6" x2="6" y1="3" y2="15" />
                <circle cx="18" cy="6" r="3" />
                <circle cx="6" cy="18" r="3" />
                <path d="M18 9a9 9 0 0 1-9 9" />
            </svg>
        </a>
        <script type="module" src="./demo.js"></script>
    </body>
</html>
