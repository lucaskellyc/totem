<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <title>totem — three.js infinite scroll stack</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: black;
                color: #cfd2d6;
                overflow: hidden;
                font:
                    13px/1.4 system-monospace,
                    monospace;
                touch-action: manipulation;
                -webkit-text-size-adjust: 100%;
            }
            canvas {
                display: block;
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }
            #hint {
                position: fixed;
                bottom: 16px;
                left: 16px;
                opacity: 0.7;
                pointer-events: none;
            }
            #repo-link {
                position: fixed;
                top: 16px;
                right: 16px;
                height: 36px;
                padding: 8px 14px;
                border-radius: 999px;
                background: transparent;
                display: flex;
                align-items: center;
                text-decoration: none;
                font: inherit;
                line-height: 1;
                transition:
                    background 0.18s ease,
                    border-color 0.18s ease;
            }
            #repo-link:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.2);
            }
            #repo-link:active {
                background: rgba(255, 255, 255, 0.12);
            }
            #repo-link svg {
                height: 24px;
                width: 24px;
            }
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: black;
                transition: opacity 0.3s ease;
            }
            #loading.done {
                opacity: 0;
                pointer-events: none;
            }
            #loading-bar {
                border-radius: 25px;
                width: 180px;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
            }
            #loading-bar-fill {
                width: 0%;
                height: 100%;
                background: #cfd2d6;
                transition:
                    width 0.18s ease,
                    background 0.5s ease;
            }
            #loading-bar-fill.complete {
                background: repeating-linear-gradient(
                    45deg,
                    #cfd2d6 0,
                    #cfd2d6 6px,
                    rgba(207, 210, 214, 0.45) 6px,
                    rgba(207, 210, 214, 0.45) 12px
                );
                background-size: 200% 100%;
                animation: loading-bar-stripes 0.6s linear infinite;
            }
            @keyframes loading-bar-stripes {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: -34px 0;
                }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://esm.sh/three@0.184.0",
                    "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <div id="loading">
            <div id="loading-bar"><div id="loading-bar-fill"></div></div>
            <div>Please hold...</div>
        </div>
        <!--<div id="hint">scroll to navigate</div>-->
        <a
            id="repo-link"
            href="https://github.com/lucaskellyc/totem"
            target="_blank"
            rel="noopener"
            aria-label="View source on GitHub"
        >
            <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="white"
                aria-hidden="true"
            >
                <path
                    d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-1.95c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.69 0-1.26.45-2.29 1.18-3.1-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.84 1.18 3.1 0 4.42-2.69 5.4-5.25 5.68.41.35.78 1.04.78 2.1v3.11c0 .3.21.66.8.55C20.21 21.39 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5z"
                />
            </svg>
        </a>
        <script type="module" src="./demo.js"></script>
    </body>
</html>
