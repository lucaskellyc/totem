<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#000000" />
        <title>totem — a three.js experiment</title>
        <style>
            * {
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                margin: 0;
                height: 100dvh;
                background: black;
                color: #cfd2d6;
                overflow: hidden;
                /* Stop trackpad side-swipes from triggering back/forward nav
                   (wheel handler also preventDefaults them). */
                overscroll-behavior: none;
                font:
                    13px/1.4 system-monospace,
                    monospace;
                touch-action: manipulation;
                -webkit-text-size-adjust: 100%;
            }
            canvas {
                position: fixed;
                top: calc(-1 * env(safe-area-inset-top, 0px));
                left: calc(-1 * env(safe-area-inset-left, 0px));
                width: calc(
                    100vw + env(safe-area-inset-left, 0px) +
                        env(safe-area-inset-right, 0px)
                );
                height: calc(
                    100dvh + env(safe-area-inset-top, 0px) +
                        env(safe-area-inset-bottom, 0px)
                );
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-user-drag: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                filter: blur(28px);
                transition: filter 0.5s ease;
            }
            canvas.intro-done {
                filter: blur(0);
            }
            canvas:active {
                cursor: grabbing;
            }
            #feather-top,
            #feather-bottom {
                position: fixed;
                left: 0;
                right: 0;
                height: 120px;
                pointer-events: none;
                z-index: 1;
            }
            #feather-top {
                top: 0;
                background: linear-gradient(
                    to bottom,
                    black 0%,
                    rgba(0, 0, 0, 0) 100%
                );
            }
            #feather-bottom {
                bottom: 0;
                background: linear-gradient(
                    to top,
                    black 0%,
                    rgba(0, 0, 0, 0) 100%
                );
            }
            #hint {
                position: fixed;
                bottom: 16px;
                left: 16px;
                opacity: 0.7;
                pointer-events: none;
            }
            #info-link {
                position: fixed;
                top: 16px;
                right: 16px;
                border-radius: 999px;
                background: transparent;
                color: #cfd2d6;
                display: flex;
                justify-content: center;
                align-items: center;
                text-decoration: none;
                font: inherit;
                font-size: 16px;
                line-height: 1;
                z-index: 1;
                opacity: 0;
                pointer-events: none;
                transition:
                    background 0.18s ease,
                    transform 0.18s ease,
                    opacity 0.7s ease;
                width: 40px;
                height: 40px;
            }
            #loading.done ~ #info-link {
                opacity: 1;
                pointer-events: auto;
            }
            #info-link:hover {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.2);
            }
            #info-link:active {
                background: rgba(255, 255, 255, 0.12);
                transform: scale(0.95);
            }
            #loading {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
                background: black;
                z-index: 1;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-user-drag: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                transition:
                    opacity 0.7s ease,
                    filter 0.6s ease,
                    transform 0.6s ease;
            }
            #loading * {
                -webkit-user-drag: none;
                pointer-events: none;
            }
            #loading.done {
                filter: blur(16px);
                opacity: 0;
                transform: scale(1.1);
                pointer-events: none;
            }
            #logo-lottie {
                width: 380px;
                height: 214px;
            }
            #loading-bar {
                border-radius: 25px;
                width: 180px;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                overflow: hidden;
                opacity: 0;
                transition: opacity 1.5s ease;
            }
            #loading-bar.visible {
                opacity: 1;
            }
            /* Wraps the bar so the error octagon can center over it. */
            #loading-bar-wrap {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Startup failed before the scene came up: a red stop-sign octagon
               with an X pops in, centered over (and in front of) the bar. */
            /* Outer octagon is the stroke colour; the inner octagon holds the
               red fill, inset 2px so a uniform ring shows through as a border
               (clip-path clips a normal CSS border, so we layer instead). */
            #loading-error {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #ff5888;
                clip-path: polygon(
                    30% 0%, 70% 0%, 100% 30%, 100% 70%,
                    70% 100%, 30% 100%, 0% 70%, 0% 30%
                );
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6);
                transition:
                    opacity 0.3s ease,
                    transform 0.3s ease;
            }
            #loading-error-inner {
                position: absolute;
                inset: 2px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(#e02525, #ff5888);
                clip-path: polygon(
                    30% 0%, 70% 0%, 100% 30%, 100% 70%,
                    70% 100%, 30% 100%, 0% 70%, 0% 30%
                );
            }
            #loading-error svg {
                width: 28px;
                height: 28px;
                stroke: #fff;
                stroke-width: 3;
            }
            #loading-bar.error ~ #loading-error {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            #loading-bar-fill {
                border-radius: 25px;
                width: 0%;
                height: 100%;
                background: #cfd2d6;
                /* Width is eased per-frame in JS; keep it out of the CSS
                   transition so the two don't fight. */
                transition:
                    background 0.5s ease,
                    opacity 0.5s ease;
            }
            #loading-bar-fill.complete {
                background: repeating-linear-gradient(
                    45deg,
                    #cfd2d6 0,
                    #cfd2d6 6px,
                    rgba(207, 210, 214, 0.6) 6px,
                    rgba(207, 210, 214, 0.6) 12px
                );
                background-size: 200% 100%;
                animation: loading-bar-stripes 0.6s linear infinite;
            }
            @keyframes loading-bar-stripes {
                from {
                    background-position: 0 0;
                }
                to {
                    background-position: -34px 0;
                }
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "https://esm.sh/three@0.184.0",
                    "three/addons/": "https://esm.sh/three@0.184.0/examples/jsm/",
                    "lottie-web": "https://esm.sh/lottie-web@5.12.2",
                    "lucide": "https://esm.sh/lucide@0.460.0"
                }
            }
        </script>
    </head>
    <body>
        <div id="feather-top"></div>
        <div id="feather-bottom"></div>
        <div id="loading">
            <div id="logo-lottie"></div>
            <div id="loading-bar-wrap">
                <div id="loading-bar"><div id="loading-bar-fill"></div></div>
                <div id="loading-error" aria-hidden="true">
                    <div id="loading-error-inner">
                        <!-- One filled X (a plus rotated 45°) so it reads as a
                             single shape rather than two overlapping strokes. -->
                        <svg viewBox="0 0 24 24">
                            <path
                                transform="rotate(45 12 12)"
                                d="M11 3.5 H13 V11 H20.5 V13 H13 V20.5 H11 V13 H3.5 V11 H11 Z"
                            />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        <script type="module">
            import lottie from "lottie-web";
            import { createElement, Info } from "lucide";
            lottie.loadAnimation({
                container: document.getElementById("logo-lottie"),
                renderer: "svg",
                loop: false,
                autoplay: true,
                path: "./assets/logo.json",
            });

            document.getElementById("info-link").appendChild(createElement(Info));
        </script>
        <a href="./info/"
            id="info-link"
        >
        </a>
        <script type="module" src="./demo.js"></script>
    </body>
</html>
