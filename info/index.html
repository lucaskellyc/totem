<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="black" />
        <title>totem — a three.js experiment</title>
        <!-- Warm up the esm.sh connection and prefetch the icon module so
             createIcons() runs (and the SVG swap happens) as early as possible. -->
        <link rel="preconnect" href="https://esm.sh" crossorigin />
        <link rel="modulepreload" href="https://esm.sh/lucide@0.460.0" />
        <link rel="modulepreload" href="https://esm.sh/lottie-web@5.12.2" />
        <style>
            * {
                color: white;
                font-family: sans-serif;
            }
            body {
                background: black;
            }

            header {
                display: flex;
                flex-direction: column;
                justify-content: start;
                align-items: center;
                text-align: center;
                margin-top: 24px
            }
            header #logo-lottie {
                width: 180px;
                height: 100px;
            }
            header span {
                display: flex;
                flex-direction: row;
                align-items: center;
            }

            .hidden {
                opacity: 0;
            }
            header, main, span, div  {
                transition: opacity 0.6s ease;
            }

            .chip {
                display: inline-flex;
                align-items: center;
                padding: 8px 16px;
                border-radius: 24px;
                margin: 24px 6px;
                font-size: 16px;
                box-shadow: inset 0 2px 2px #555;
            }
            /* The [data-lucide] placeholder reserves the SVG's exact box so
               swapping <i> -> <svg> after the module loads causes no layout
               shift (CLS). Keep these dimensions in sync with each other. */
            svg, [data-lucide] {
                display: inline-block;
                box-sizing: content-box;
                padding: 0 2px;
                width: 18px;
                height: 18px;
            }

            .chip-link {
                text-decoration: none;
                transition: transform 0.1s ease-in-out;
                -webkit-user-select: none;
                user-select: none;
            }

            .chip-link:active {
                transform: scale(0.95);
            }
            .chip-link svg {
                stroke-width: 2px;
            }

            .chip-link.raised {
                background: linear-gradient(to bottom, #bbb, white);
                color: black;
                box-shadow: inset 0 2px 2px white;
            }
            .chip-link.raised:hover {
                background: white;
            }
            .chip-link.raised svg {
                stroke: black;
            }

            .chip-link.normal {
                background-color: #333;
                color: white;
                box-shadow: inset 0 2px 2px #555;
            }
            .chip-link.normal:hover {
                background: #555;
            }
            .chip-link.normal svg {
                stroke: white;
            }

            .chip-label {
                background: #333;
                color: #bbb;
                font-family: monospace;
            }
            .chip-label svg {
                stroke: #bbb;
                transform: translateY(-0.5px);
                margin-right: 4px;
            }

            main {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 24px;
            }
            main div {
                background-color: #333;
                padding: 10px 25px;
                border-radius: 32px;
                box-shadow: inset 0 2px 2px #555;
            }
            main p {
                display: inline-block;
                max-width: 360px;
                text-wrap: pretty;
                text-align: center;
            }
            p a {
                background-color: #555;
                display: inline-flex;
                align-content: center;
                text-decoration: none;
                font-weight: bold;
                border-radius: 25px;
                margin: 4px 0;
                padding: 2px 0 2px 6px;
            }
            p a:hover {
                color: #ddd;
            }
            p a:hover svg {
                stroke: #ddd;
            }
            p a svg {
                height: 18px;
                stroke-width: 3px;
            }

            #hero-loop {
                background-color: black;
                width: 75vw;
                max-width: 450px;
                aspect-ratio: 4/3;
                box-shadow: none;
                border: solid 4px #333;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "lottie-web": "https://esm.sh/lottie-web@5.12.2",
                    "lucide": "https://esm.sh/lucide@0.460.0"
                }
            }
        </script>
    </head>
    <body>
        <header>
            <div id="logo-lottie" class="hidden"></div>
            <span class="hidden">
                <a class="chip chip-link normal" href="https://github.com/lucaskellyc/totem">
                    GitHub
                    <i data-lucide="arrow-up-right"></i>
                </a>
                <a class="chip chip-link raised" href="https://lucaskellyc.github.io/totem/">
                    Demo
                    <i data-lucide="arrow-right"></i>
                </a>
            </span>
        </header>
        <main>
            <div id="hero-loop" class="hidden"></div>
            <div class="hidden">
                <p><strong>Totem</strong> is an experimental block-based 3D scene builder created using <a href="https://threejs.org/">three.js<i data-lucide="arrow-up-right"></i></a></p>
            </div>
        </main>
        <script type="module">
          import lottie from "lottie-web";
          import { createIcons, ArrowUpRight, ArrowRight, Cog } from "lucide";

          lottie.loadAnimation({
              container: document.getElementById("logo-lottie"),
              renderer: "svg",
              loop: false,
              autoplay: true,
              path: "../assets/logo.json",
          });
          document.querySelectorAll(".hidden").forEach((element, i) => {
            setTimeout(() => {
              element.classList.remove("hidden");
            }, i * 100)
          });

          createIcons({ icons: { ArrowUpRight, ArrowRight, Cog } });
        </script>
    </body>
</html>
